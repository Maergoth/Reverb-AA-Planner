<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origins AA Planner - Discussion in discord.gg/reverb</title>
  <style>
    :root {
      --bg-start: #0f0f0f;
      --bg-end: #1a1a1a;
      --node-bg: #2a2a2a;
      --node-border: #555;
      --node-hover: #ffcc00;
      --node-unclick: #ff4444;
      --node-selected: #00ff88;
      --accent: #00ccff;
      --shadow: rgba(0, 0, 0, 0.7);
      --font-main: 'Segoe UI', sans-serif;

    /* Ensure the EoF link SVG is behind nodes */
    /* This override is placed here so that it is loaded alongside other CSS */
    }

    /* disable text selection globally */
    html, body {
      -webkit-user-select: none;  /* Chrome, Safari, Edge */
      -moz-user-select: none;     /* Firefox */
      -ms-user-select: none;      /* IE10+ */
      user-select: none;          /* standard */
    }

    /* allow text selection in dropdown inputs */
    .dropdowns select {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, var(--bg-start) 0%, var(--bg-end) 100%);
      color: #f0f0f0;
      font-family: var(--font-main);
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 2rem;
      text-shadow: 2px 2px 4px var(--shadow);
    }

    .dropdowns {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .dropdowns label {
      font-weight: bold;
      align-self: center;
    }

    .dropdowns select {
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--node-border);
      background: var(--node-bg);
      color: #f0f0f0;
      box-shadow: inset 2px 2px 6px var(--shadow);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .dropdowns select:hover {
      border-color: var(--accent);
    }

    #treeContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      /* Position the container relative so that the SVG overlay for KOS
         connectors can be absolutely positioned within it. */
      position: relative;
    }

    /* SVG used to draw connecting lines between nodes in the KOS tree */
    #kosLinks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* place the KOS connectors behind the node icons */
      z-index: 0;
    }

    .tree {
      display: grid;
      /* let each of the 5 columns flex-shrink or grow */
      grid-template-columns: repeat(5, minmax(0, 1fr));
      /* rows auto-sized to match column width via aspect-ratio on .node */
      grid-auto-rows: 1fr;
      gap: 8px;
      /* never exceed the natural width of 5×100px+gaps */
      max-width: calc(5 * 100px + 4 * 8px);
      width: 100%;
      /* center all grid items in their cells */
      justify-items: center;
    }


    .node {
      /* use circles instead of squares */
      background: var(--node-bg);
      border: 2px solid var(--node-border);
      border-radius: 50%;
      /* Reduce node size by 25% to allow more breathing room in the EoF layouts */
      width: clamp(40px, 13vw, 75px);
      aspect-ratio: 1 / 1;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 6px var(--shadow);
      overflow: visible;
    }

    .node.clickable {
      border-color: var(--node-hover);
    }

    .node.clickable:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 8px 12px var(--shadow);
    }

    .node.unclickable:hover {
      border-color: var(--node-unclick);
    }

    .tooltip {
      pointer-events: none;
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--node-bg);
      padding: 8px;
      border: 1px solid var(--node-border);
      border-radius: 6px;
      /* Allow text to wrap and set a reasonable width so that long descriptions
         will not overflow off the edge of the viewport.  The overflow-wrap
         property helps break long words when necessary. */
      white-space: normal;
      /* Constrain the tooltip to a reasonable width range.  The min-width ensures
         tooltips expand enough to avoid vertical stacking when long words are
         present, while max-width prevents them from exceeding the viewport. */
      min-width: 200px;
      max-width: 320px;
      /* Break words at spaces or hyphens but avoid breaking every character. */
      word-wrap: break-word;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s;
      /* raise tooltip above connecting lines so it never hides behind the SVG lattice */
      z-index: 1000;
      font-size: 0.85rem;
      line-height: 1.2;
      box-shadow: 0 2px 4px var(--shadow);
    }

    .node:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    .node.selected {
      border-color: var(--node-selected);
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 10px var(--node-selected);
    }

    /* Place the lines SVG behind nodes for EoF trees */
    #eofLinks {
      z-index: 0;
    }
    .tree .node {
      /* Make nodes positioned so z-index takes effect. Without a position
         value, z-index is ignored and the SVG connectors may overlap the
         circles. Setting position: relative ensures the nodes stack above
         the lines. */
      position: relative;
      z-index: 1;
    }

    /* Color-coding for each tree column.  We fill the node background
       instead of altering the outline.  Selected nodes use a slightly
       stronger fill with a matching glow. */
/* Make non-selected nodes largely opaque (0.9 alpha) so connectors drawn below
   remain mostly hidden while still allowing subtle colour blending with
   the dark background.  A small amount of transparency preserves the
   original appearance without letting the lines dominate. */
/* Semi-transparent backgrounds for base nodes */
.line0 { background: rgba(231, 76, 60, 0.25); }
.line1 { background: rgba(52, 152, 219, 0.25); }
.line2 { background: rgba(46, 204, 113, 0.25); }
.line3 { background: rgba(241, 196, 15, 0.25); }
.line4 { background: rgba(155, 89, 182, 0.25); }
/* When a node is selected, make the fill fully opaque and add a glow to distinguish it. */
/* Slightly less transparent backgrounds for selected nodes */
.line0.selected { background: rgba(231, 76, 60, 0.45); box-shadow: 0 0 10px #e74c3c; }
.line1.selected { background: rgba(52, 152, 219, 0.45); box-shadow: 0 0 10px #3498db; }
.line2.selected { background: rgba(46, 204, 113, 0.45); box-shadow: 0 0 10px #2ecc71; }
.line3.selected { background: rgba(241, 196, 15, 0.45); box-shadow: 0 0 10px #f1c40f; }
.line4.selected { background: rgba(155, 89, 182, 0.45); box-shadow: 0 0 10px #9b59b6; }

    /* Container to display labels underneath each column */
    .line-labels {
      display: grid;
      width: 100%;
      gap: 8px;
      margin-top: 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      box-sizing: border-box;
    }
    .line-labels .label {
      /* Center branch labels within their allocated grid span */
      padding: 2px 0;
      /* Use flexbox to center the text horizontally and vertically */
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .controls {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .controls button {
      margin: 0 5px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 6px var(--shadow);
      transition: background 0.2s, transform 0.1s;
    }

    .controls button:hover {
      background: #009bbf;
      transform: translateY(-2px);
    }

    /* Disabled buttons appear dimmed and cannot be clicked */
    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #pointIndicator {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--accent);
      text-shadow: 1px 1px 2px var(--shadow);
    }
  </style>
</head>
<body>
  <h1>Origins AA Planner - Discussion in discord.gg/reverb</h1>
  <div class="dropdowns">
    <label for="kosSelect">KOS:</label>
    <!-- add a "Select…" option for KOS to allow clearing the selection when swapping to an EoF tree -->
    <select id="kosSelect">
      <option value="">Select...</option>
    </select>
    <label for="eofSelect">EOF:</label>
    <select id="eofSelect"><option value="">Select...</option></select>
    <!-- ROK checkbox to toggle point cap between 50 and 70 -->
    <label><input type="checkbox" id="rokCheckbox"> ROK</label>
  </div>

  <div id="treeContainer">
    <!-- SVG used to draw connecting lines between nodes in the KOS tree -->
    <svg id="kosLinks" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0;"></svg>
    <div class="tree" id="tree"></div>
    <!-- Labels for each column in the KOS tree -->
    <div id="lineLabelsKos" class="line-labels"></div>
      <div class="controls">
      <div id="pointIndicator">0/50</div>
      <button id="resetBtn">Reset</button>
      <button id="copyUrlBtn">Export</button>
    </div>
  </div>

  <!-- Separate container for EoF trees. Hidden by default; toggled when an EoF class is selected. -->
  <div id="eofTreeContainer" style="display:none;">
    <div id="eofTreeWrapper" style="position:relative;">
      <!-- SVG used to draw connecting lines between nodes in the EoF tree -->
      <svg id="eofLinks" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></svg>
      <!-- The grid for EoF nodes. Will have its column count set dynamically based on the selected class. -->
      <div id="eofTree" class="tree" style="z-index:2;"></div>
      <!-- Labels for each column in the EoF tree -->
      <div id="lineLabelsEof" class="line-labels"></div>
    </div>
    <div class="controls">
      <div id="eofPointIndicator">0/50</div>
      <!-- Playback removed -->
      <button id="eofResetBtn">Reset</button>
      <button id="eofCopyUrlBtn">Export</button>
    </div>
  </div>
  <script>
    // Allow point cap to change via ROK checkbox; initialise at 50 but update dynamically
    let totalPoints = 50;

    // Base pixel size of nodes used for consistent grid spacing.
    const nodeSize = 120;

    // Max points allowed in an EoF tree.
    // Max points allowed in an EoF tree; adjustable via ROK checkbox
    let eofMaxPoints = 50;

    // Colour palette for tree columns.
    const lineColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];

    // URL-safe character set mapping small integers to single chars.
    const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

    // Encode KOS builds: class index + node/rank pairs terminated by '.'.
    function encodeKosBuilds() {
      let result = '';
      KOS_CLASSES.forEach((cls, cidx) => {
        const arr = builds[cls];
        if (!arr) return;
        let segment = '';
        // Only encode nodes with non-zero rank as index/rank pairs.
        for (let i = 0; i < arr.length; i++) {
          const v = arr[i] || 0;
          if (v > 0) {
            segment += charset[i] + charset[v];
          }
        }
        if (segment.length > 0) {
          result += charset[cidx] + segment + '.';
        }
      });
      return result;
    }

    // Decode KOS builds (supports new variable-length and old fixed formats).
    function decodeKosBuild(encoded) {
      if (!encoded) return;
      // New format: class index followed by node/rank pairs until '.'.
      if (encoded.indexOf('.') >= 0) {
        let pos = 0;
        while (pos < encoded.length) {
          const classChar = encoded.charAt(pos++);
          const clsIdx = charset.indexOf(classChar);
          if (clsIdx < 0 || clsIdx >= KOS_CLASSES.length) break;
          const cls = KOS_CLASSES[clsIdx];
          const arr = new Array(nodeCount).fill(0);
          while (pos < encoded.length) {
            const ch = encoded.charAt(pos++);
            if (ch === '.') break; // end of this class segment
            const nodeIdx = charset.indexOf(ch);
            const valChar = encoded.charAt(pos++);
            const val = charset.indexOf(valChar);
            if (nodeIdx >= 0 && nodeIdx < nodeCount) {
              arr[nodeIdx] = val >= 0 ? val : 0;
            }
          }
          builds[cls] = arr;
        }
      } else {
        // Old fixed‑length format: segmentLength = 1 + nodeCount.  This
        // fallback preserves compatibility with older URLs.  If the
        // encoded length isn't a multiple of the expected segment
        // length, throw.
        const segmentLength = 1 + nodeCount;
        if (encoded.length % segmentLength !== 0) {
          throw new Error('Invalid KOS build encoding');
        }
        for (let pos = 0; pos < encoded.length; pos += segmentLength) {
          const classChar = encoded.charAt(pos);
          const clsIdx = charset.indexOf(classChar);
          if (clsIdx < 0 || clsIdx >= KOS_CLASSES.length) continue;
          const cls = KOS_CLASSES[clsIdx];
          const arr = new Array(nodeCount).fill(0);
          for (let i = 0; i < nodeCount; i++) {
            const ch = encoded.charAt(pos + 1 + i);
            const val = charset.indexOf(ch);
            arr[i] = val >= 0 ? val : 0;
          }
          builds[cls] = arr;
        }
      }
    }

    // Encode all EoF builds into a compact string.  Each class segment
    // begins with a class index character followed by zero or more pairs
    // of characters, one for the node index and one for the rank value.  A
    // period ('.') terminates the segment.  Only nodes with ranks > 0
    // contribute pairs.  Classes with no points are omitted entirely.
    function encodeEofBuilds() {
      let result = '';
      EOF_CLASSES.forEach((cls, cidx) => {
        const tree = eofTrees[cls];
        if (!tree) return;
        const obj = eofBuilds[cls];
        let segment = '';
        tree.nodes.forEach((n, nidx) => {
          const v = obj && obj[n.id] ? obj[n.id] : 0;
          if (v && v > 0) {
            // encode node index and rank
            segment += charset[nidx] + charset[v];
          }
        });
        if (segment.length > 0) {
          result += charset[cidx] + segment + '.';
        }
      });
      return result;
    }

    // Decode EoF builds from the compact string.  Reads class index
    // characters followed by node/rank pairs until a period ('.') ends the
    // segment.  Populates eofBuilds accordingly.
    function decodeEofBuild(encoded) {
      if (!encoded) return;
      let pos = 0;
      while (pos < encoded.length) {
        const classChar = encoded.charAt(pos++);
        const clsIdx = charset.indexOf(classChar);
        if (clsIdx < 0 || clsIdx >= EOF_CLASSES.length) break;
        const cls = EOF_CLASSES[clsIdx];
        if (!eofBuilds[cls]) eofBuilds[cls] = {};
        const tree = eofTrees[cls];
        if (!tree) break;
        while (pos < encoded.length) {
          const ch = encoded.charAt(pos++);
          if (ch === '.') break; // end of class segment
          const nodeIdx = charset.indexOf(ch);
          const valChar = encoded.charAt(pos++);
          const val = charset.indexOf(valChar);
          if (nodeIdx < 0 || nodeIdx >= tree.nodes.length) continue;
          const nodeId = tree.nodes[nodeIdx].id;
          eofBuilds[cls][nodeId] = val >= 0 ? val : 0;
        }
      }
    }

    // Encode the point allocation sequence into a compact string.  Each entry
    // becomes three characters: a tree marker ('K' for KOS or 'E' for EoF),
    // the class index encoded with charset, and the node index encoded
    // with charset.  For EoF entries, node indexes are looked up in the
    // corresponding class tree.  Returns an empty string if sequence is
    // empty.
    function encodeSeq() {
      if (!pointSequence || pointSequence.length === 0) return '';
      let out = '';
      for (const ent of pointSequence) {
        if (ent.tree === 'KOS') {
          const clsIdx = KOS_CLASSES.indexOf(ent.class);
          if (clsIdx < 0) continue;
          out += 'K' + charset[clsIdx] + charset[ent.index];
        } else if (ent.tree === 'EOF') {
          const clsIdx = EOF_CLASSES.indexOf(ent.class);
          const tree = eofTrees[ent.class];
          if (clsIdx < 0 || !tree) continue;
          const nodeIdx = tree.nodes.findIndex(n => n.id === ent.id);
          if (nodeIdx < 0) continue;
          out += 'E' + charset[clsIdx] + charset[nodeIdx];
        }
      }
      return out;
    }

    // Decode the allocation sequence from the compact string.  Parses
    // three-character groups and rebuilds pointSequence accordingly.  If
    // decoding fails, returns false.
    function decodeSeq(encoded) {
      const seq = [];
      if (!encoded) return seq;
      const length = encoded.length;
      for (let i = 0; i < length; i += 3) {
        const marker = encoded.charAt(i);
        const clsChar = encoded.charAt(i + 1);
        const nodeChar = encoded.charAt(i + 2);
        if (!marker || !clsChar || !nodeChar) break;
        if (marker === 'K') {
          const clsIdx = charset.indexOf(clsChar);
          const nodeIdx = charset.indexOf(nodeChar);
          if (clsIdx < 0 || nodeIdx < 0) continue;
          const cls = KOS_CLASSES[clsIdx];
          seq.push({ tree: 'KOS', class: cls, index: nodeIdx });
        } else if (marker === 'E') {
          const clsIdx = charset.indexOf(clsChar);
          const nodeIdx = charset.indexOf(nodeChar);
          if (clsIdx < 0 || nodeIdx < 0) continue;
          const cls = EOF_CLASSES[clsIdx];
          const tree = eofTrees[cls];
          if (!tree || nodeIdx >= tree.nodes.length) continue;
          const nodeId = tree.nodes[nodeIdx].id;
          seq.push({ tree: 'EOF', class: cls, id: nodeId });
        }
      }
      return seq;
    }
    const KOS_CLASSES = [
      "Bard","Brawler","Cleric","Crusader","Druid",
      "Enchanter","Predator","Rogue","Shaman",
      "Sorcerer","Summoner","Warrior"
    ];

    // === EoF class definitions ===
    // These classes represent the Kingdom of Everfrost (Echoes of Faydwer) trees. Each entry
    // defines a set of lines (branches) along with their column index and the number of points
    // required in that line to unlock the endline.  Nodes describe individual abilities with
    // their display name, short description, line assignment, grid position, maximum ranks and
    // prerequisite conditions.  Prerequisites are satisfied if any of the referenced nodes
    // have at least the specified rank.
// Add the Conjuror class to the list of available EoF classes.  This array
// drives the class dropdown and the mapping used to initialise builds.
// Include Defiler in the list of Echoes of Faydwer classes.  This drives
// the dropdown and build initialisation for the EoF portion of the planner.
const EOF_CLASSES = ["Assassin", "Berserker", "Brigand", "Bruiser", "Coercer", "Conjuror", "Defiler", "Dirge", "Fury", "Guardian", "Illusionist", "Inquisitor", "Monk", "Mystic", "Necromancer", "Paladin", "Ranger", "Shadowknight", "Swashbuckler", "Templar", "Troubador", "Warden", "Warlock", "Wizard"];
    const eofTrees = {
      Assassin: {
        lines: {
          // Original base columns used for ordering and gating (5‑column segments).  Positions are defined explicitly below.
          Bleeding: { col: 0, gating: 20 },
          Tricks:   { col: 3, gating: 20 },
          Physicality: { col: 6, gating: 20 },
          Poisons: { col: 8, gating: 20 }
        },
        nodes: [
          // Assassin nodes mapped onto a 20×20 grid.  Top and bottom rows align horizontally.
          { id:'scrapingBlow',    name:'Enhance: Scraping Blow',    description:'Increases overtime damage by 7% per rank.',                line:'Bleeding',    row:0,  col:1,  max:5, cost:1, prereqs:[] },
          { id:'flowingWound',    name:'Enhance: Flowing Wound',    description:'Increases overtime damage by 4% per rank.',                line:'Bleeding',    row:1,  col:0,  max:5, cost:1, prereqs:[{id:'scrapingBlow', rank:3}] },
          { id:'deadlyWound',     name:'Enhance: Deadly Wound',     description:'Increases overtime damage by 6% per rank.',                line:'Bleeding',    row:2,  col:1,  max:5, cost:1, prereqs:[{id:'flowingWound', rank:3},{id:'jugular', rank:3}] },
          { id:'malignantMark',   name:'Enhance: Malignant Mark',   description:'Increases trigger chance by 1% per rank.',                line:'Bleeding',    row:3,  col:0,  max:5, cost:1, prereqs:[{id:'flowingWound', rank:3},{id:'deadlyWound', rank:3}] },
          { id:'cloakedAssault',  name:'Enhance: Cloaked Assault',  description:'Increases overtime damage by 5% per rank.',                line:'Bleeding',    row:4,  col:1,  max:5, cost:1, prereqs:[{id:'malignantMark', rank:3},{id:'freezingStrike', rank:3}] },
          { id:'excessiveBleeding', name:'Excessive Bleeding',      description:'Reduces maximum health by up to 5% for each Bleeding ability active on a target.', line:'Bleeding', row:5,  col:1, max:1, cost:1, prereqs:[] },
          // Tricks branch with original positions
          { id:'cheapShot',       name:'Enhance: Cheap Shot',       description:'Increases duration by 0.2 seconds per rank.',              line:'Tricks',      row:0,  col:3,  max:5, cost:1, prereqs:[] },
          { id:'jugular',         name:'Enhance: Jugular',          description:'Increases stifle duration by 1 second per rank.',            line:'Tricks',      row:1,  col:2,  max:5, cost:1, prereqs:[{id:'scrapingBlow', rank:3},{id:'cheapShot', rank:3}] },
          { id:'constriction',    name:'Enhance: Constriction',     description:'Improves reuse speed by 2 seconds per rank.',              line:'Tricks',      row:1,  col:4,  max:5, cost:1, prereqs:[{id:'cheapShot', rank:3},{id:'honedReflexes', rank:3}] },
          { id:'freezingStrike',  name:'Enhance: Freezing Strike',  description:'Increases the duration by 1.5 seconds per rank.',            line:'Tricks',      row:3,  col:2,  max:5, cost:1, prereqs:[{id:'deadlyWound', rank:3},{id:'jugular', rank:3}] },
          { id:'cripplingStrike', name:'Enhance: Crippling Strike', description:'Improves defense reduction by 4% per rank.',                   line:'Tricks',      row:3,  col:4,  max:5, cost:1, prereqs:[{id:'constriction', rank:3},{id:'honedReflexes', rank:3}] },
          { id:'masteryStrikes',  name:'Enhance: Mastery Strikes',  description:'Improves reuse speed by 8 seconds per rank.',                 line:'Tricks',      row:4,  col:3,  max:5, cost:1, prereqs:[{id:'freezingStrike', rank:3},{id:'cripplingStrike', rank:3}] },
          { id:'repeatedStabbing',name:'Repeated Stabbing',         description:'Increases recovery speed of caster by 100%.',                   line:'Tricks',      row:5,  col:3,  max:1, cost:1, prereqs:[] },
          // Physicality branch with original positions
          { id:'sprint',          name:'Enhance: Sprint',           description:'Increases sprint movement speed by 5% and reduces initial power cost by 10% per rank.', line:'Physicality', row:0,  col:6,  max:5, cost:1, prereqs:[] },
          { id:'honedReflexes',   name:'Enhance: Honed Reflexes',   description:'Increases attack speed by an additional 3% per rank.',        line:'Physicality', row:1,  col:5,  max:5, cost:1, prereqs:[{id:'sprint', rank:3},{id:'constriction', rank:3}] },

    const eofBuilds = {};
    EOF_CLASSES.forEach(cls => {
      const tree = eofTrees[cls];
      // Determine grid dimensions.  Grid rows are based on the
      // highest explicit row index defined in the class data.
      tree.gridRows = Math.max(...tree.nodes.map(n => n.row)) + 1;
      // Determine grid columns based on highest explicit col index plus one.
      tree.gridCols = Math.max(...tree.nodes.map(n => n.col)) + 1;
      // Compute the maximum possible points for this class
      tree.maxPoints = tree.nodes.reduce((sum, n) => sum + n.max * n.cost, 0);
      // Create a value store keyed by node id
      const buildObj = {};
      tree.nodes.forEach(n => { buildObj[n.id] = 0; });
      eofBuilds[cls] = buildObj;

    // Node layout
    const nodeTemplate = [];
    nodeTemplate.push({ x: 2, y: 0, max: 1, cost: 1 });
    for (let col = 0; col < 5; col++) {
      for (let tier = 1; tier <= 4; tier++) nodeTemplate.push({ x: col, y: tier, max: 8, cost: 1 });
      nodeTemplate.push({ x: col, y: 5, max: 1, cost: 8 });

    const nodeCount = nodeTemplate.length;

    // Build storage
    const builds = {};

    let selectedEofClass = '';
    let eofTreeData = [];
    let eofPointsSpent = 0;
    // track whether we are showing KOS or EoF tree; defaults to KOS
    let mode = 'KOS';
    const eofSelect = document.getElementById('eofSelect');
    const treeContainer = document.getElementById('treeContainer');
    const eofTreeContainer = document.getElementById('eofTreeContainer');
    const eofTreeWrapper   = document.getElementById('eofTreeWrapper');
    const eofTreeEl        = document.getElementById('eofTree');
    const eofLinks         = document.getElementById('eofLinks');

    const kosLinks         = document.getElementById('kosLinks');

    const eofResetBtn      = document.getElementById('eofResetBtn');
    const eofCopyUrlBtn    = document.getElementById('eofCopyUrlBtn');

    // === ROK checkbox ===
    // Retrieve the ROK checkbox and set up a handler to adjust point caps between 50 and 70.
    const rokCheckbox = document.getElementById('rokCheckbox');
    function updatePointCaps() {
      const cap = rokCheckbox.checked ? 70 : 50;
      totalPoints = cap;
      eofMaxPoints = cap;
      // Recalculate spent points and update indicators
      recalcPoints();
      recalcEofPoints();
      // Re-render trees to update clickable states based on new caps
      // Only render if data has been initialised to avoid errors on page load
      if (treeData && treeData.length > 0) {
        renderTree();
      }
      if (eofTreeData && eofTreeData.length > 0) {
        renderEofTree();
      }
    }
    // Initialise the caps on page load
    updatePointCaps();
    // Update caps whenever the checkbox is toggled
    rokCheckbox.addEventListener('change', updatePointCaps);

    // === Playback state and controls (unused) ===
    // pointSequence and removedFlag are kept for compatibility but playback has been removed.
    let pointSequence = [];
    let removedFlag = false;
    // Play buttons have been removed so these references will be null.
    const playBtn = null;
    const eofPlayBtn = null;

    resetBtn.onclick = () => {
      // reset all ranks for every KOS class
      KOS_CLASSES.forEach(cls => {
        builds[cls] = new Array(nodeCount).fill(0);
      });
      // reset all ranks for every EoF class
      EOF_CLASSES.forEach(cls => {
        const obj = eofBuilds[cls];
        if (obj) {
          Object.keys(obj).forEach(id => { obj[id] = 0; });
        }
      });
      // clear recorded sequence and removal state
      if (typeof pointSequence !== 'undefined') pointSequence = [];
      if (typeof removedFlag !== 'undefined') removedFlag = false;
      // remove all query parameters from the URL
      const url = new URL(window.location);
      url.search = '';
      window.history.replaceState(null, '', url);
      // refresh UI by reloading builds for current selections
      if (typeof loadBuild === 'function') loadBuild();
      if (typeof loadEofBuild === 'function') loadEofBuild();
      // No playback state to update
    };

    // Reset the currently selected EoF tree.  Clears all ranks and removes
    // the "eof" parameter from the URL.
    eofResetBtn.onclick = () => {
      // reset all ranks for every KOS and EoF class
      KOS_CLASSES.forEach(cls => {
        builds[cls] = new Array(nodeCount).fill(0);
      });
      EOF_CLASSES.forEach(cls => {
        const obj = eofBuilds[cls];
        if (obj) Object.keys(obj).forEach(id => { obj[id] = 0; });
      });
      // clear sequence and removal state
      if (typeof pointSequence !== 'undefined') pointSequence = [];
      if (typeof removedFlag !== 'undefined') removedFlag = false;
      // wipe all query parameters
      const url2 = new URL(window.location);
      url2.search = '';
      window.history.replaceState(null, '', url2);
      // refresh UI by reloading builds for current selections
      if (typeof loadBuild === 'function') loadBuild();
      if (typeof loadEofBuild === 'function') loadEofBuild();

    copyUrlBtn.onclick = () => {

    eofCopyUrlBtn.onclick = () => {

    function init() {
      // 1. parse any “build” (KOS) and "eof" (EoF) params from the URL
      const params = new URLSearchParams(window.location.search);
      if (params.has('build')) {
        const enc = params.get('build');
        let decoded = false;
        try {
          decodeKosBuild(decodeURIComponent(enc));
          decoded = true;
        } catch (err) {
          // fall back to old base64 JSON format
          try {
            const obj = JSON.parse(atob(enc));
            Object.entries(obj).forEach(([cls, val]) => {
              if (!builds[cls]) return;
              if (typeof val === 'string') {
                const bytes = atob(val);
                const arr = new Array(nodeCount).fill(0);
                for (let i = 0; i < bytes.length && i < nodeCount; i++) {
                  arr[i] = bytes.charCodeAt(i);
                }
                builds[cls] = arr;
              } else if (Array.isArray(val) && val.length === nodeCount) {
                builds[cls] = val;
              }
            });
            decoded = true;
          } catch (e2) {
            console.error('Invalid KOS build data in URL:', e2);
          }
        }
      }
      if (params.has('eof')) {
        const enc = params.get('eof');
        let decoded = false;
        try {
          decodeEofBuild(decodeURIComponent(enc));
          decoded = true;
        } catch (err) {
          // fallback to old base64 JSON format
          try {
            const obj = JSON.parse(atob(enc));
            Object.entries(obj).forEach(([cls, values]) => {
              if (eofTrees[cls]) {
                Object.entries(values).forEach(([id, val]) => {
                  if (eofBuilds[cls] && id in eofBuilds[cls]) {
                    eofBuilds[cls][id] = val;
                  }
                });
              }
            });
            decoded = true;
          } catch (e2) {
            console.error('Invalid EoF build data in URL:', e2);
          }
        }
      }

      // Load the allocation sequence and removal flag from the URL if present.
      if (params.has('seq')) {
        const seqEnc = params.get('seq');
        try {
          pointSequence = decodeSeq(decodeURIComponent(seqEnc));
        } catch (err) {
          console.error('Invalid sequence data in URL:', err);
        }
      }
      // no longer track removal flag from URL

      // 2. populate the class dropdowns
      // insert the selectable KOS classes (skip index 0 because we added a blank option in the markup)
      KOS_CLASSES.forEach(c => {
        const opt = new Option(c, c);
        kosSelect.appendChild(opt);
      });
      EOF_CLASSES.forEach(c => eofSelect.appendChild(new Option(c, c)));

      // 3. set up initial selections and handlers
      // default initial selection for KOS (first class) unless a build is loaded
      selectedClass = KOS_CLASSES[0];
      lastEditedClass = selectedClass;
      kosSelect.value = selectedClass;
      // handler for KOS dropdown
      kosSelect.onchange = () => {
        const val = kosSelect.value;
        if (!val) {
          // Clear KOS selection; if an EoF class is selected, remain in EoF mode
          if (eofSelect.value) {
            mode = 'EOF';
            treeContainer.style.display = 'none';
            eofTreeContainer.style.display = 'flex';
          } else {
            mode = 'KOS';
            // hide everything until a class is selected
            treeContainer.style.display = 'none';
            eofTreeContainer.style.display = 'none';
          }
          return;
        }
        mode = 'KOS';
        selectedClass = val;
        // When selecting a KOS class, clear the EoF selection
        eofSelect.value = '';
        treeContainer.style.display = 'flex';
        eofTreeContainer.style.display = 'none';
        loadBuild();
      };
      // handler for EoF dropdown
      eofSelect.onchange = () => {
        const val = eofSelect.value;
        if (!val) {
          // no EoF class selected; revert to KOS view if KOS is selected
          if (kosSelect.value) {
            mode = 'KOS';
            treeContainer.style.display = 'flex';
            eofTreeContainer.style.display = 'none';
            loadBuild();
          } else {
            // no class selected at all; hide trees
            mode = 'KOS';
            treeContainer.style.display = 'none';
            eofTreeContainer.style.display = 'none';
          }
          return;
        }
        selectedEofClass = val;
        mode = 'EOF';
        // When selecting an EoF class, clear the KOS selection
        kosSelect.value = '';
        treeContainer.style.display = 'none';
        eofTreeContainer.style.display = 'flex';
        loadEofBuild();
      };

      // Render the first KOS build by default (if no class loaded via URL).  If the
      // initial KOS selection is blank (due to a URL-loaded EoF build), the proper
      // container will be shown later in loadEofBuild().
      if (kosSelect.value) {
        treeContainer.style.display = 'flex';
        eofTreeContainer.style.display = 'none';
        loadBuild();
      }
      // Select a default tab based on any points spent.  Prefer KOS classes
      // with points; if none, fallback to the first EoF class with points.  If
      // no points are spent anywhere, keep the default selection (first KOS
      // class).  After selection, load the appropriate build.
      (function selectDefaultTab() {
        // Check KOS classes for any points spent
        let foundKos = null;
        for (const cls of KOS_CLASSES) {
          const arr = builds[cls];
          if (arr && arr.some(v => v > 0)) {
            foundKos = cls;
            break;
          }
        }
        if (foundKos) {
          selectedClass = foundKos;
          lastEditedClass = foundKos;
          kosSelect.value = foundKos;
          eofSelect.value = '';
          mode = 'KOS';
          treeContainer.style.display = 'flex';
          eofTreeContainer.style.display = 'none';
          loadBuild();
          return;
        }
        // Otherwise check EoF classes
        let foundEof = null;
        for (const cls of EOF_CLASSES) {
          const obj = eofBuilds[cls];
          if (obj) {
            for (const val of Object.values(obj)) {
              if (val > 0) {
                foundEof = cls;
                break;
              }
            }
          }
          if (foundEof) break;
        }
        if (foundEof) {
          selectedEofClass = foundEof;
          kosSelect.value = '';
          eofSelect.value = foundEof;
          mode = 'EOF';
          treeContainer.style.display = 'none';
          eofTreeContainer.style.display = 'flex';
          loadEofBuild();
        }
      })();
      // Playback removed; no play button state to update
    }

    function loadBuild() {
      treeData = nodeTemplate.map((t, i) => ({ ...t, value: builds[selectedClass][i] }));
      recalcPoints();
      renderTree();
    }
    function saveBuild() {
        builds[selectedClass] = treeData.map(n => n.value);
        updateURL();    // ← push the new state into the URL
    }

    // Persist both KOS and EoF build data into the URL using the compact encoding
    function updateURL() {
        const url = new URL(window.location);
        // Encode builds using compact format for shorter URLs
        const kosStr = encodeKosBuilds();
        const eofStr = encodeEofBuilds();
        /*
         * Construct a new URLSearchParams to control the order of query
         * parameters explicitly.  When using url.searchParams.set() on an
         * existing URL object, parameters retain their original insertion
         * order which can lead to `eof` appearing before `build` if the EoF
         * tree was populated prior to the KOS tree.  To avoid this, we
         * assemble a fresh set of parameters starting with the KOS build,
         * followed by the EoF build (if present).  Sequence and removal
         * state are not encoded since playback has been removed.
         */
        const newParams = new URLSearchParams();
        if (kosStr && kosStr.length > 0) {
          newParams.set('build', kosStr);
        }
        if (eofStr && eofStr.length > 0) {
          newParams.set('eof', eofStr);
        }
        // Apply the new query string to the URL
        url.search = newParams.toString();
        window.history.replaceState(null, '', url);
    }

    // Update the state of the Play buttons.  Disable playback if too many points
    // are spent (>100), if points have been removed, or if no sequence exists.
    function updatePlayButtons() {
      if (!playBtn || !eofPlayBtn) return;
      // compute total ranks spent across all KOS and EoF builds.  A rank is
      // counted as one regardless of the node's point cost.  This prevents
      // weighted costs from prematurely disabling playback when exactly 100
      // ranks are invested.
      let total = 0;
      // sum KOS builds by rank count
      KOS_CLASSES.forEach(cls => {
        const arr = builds[cls];
        if (!arr) return;
        for (let i = 0; i < arr.length; i++) {
          const val = arr[i] || 0;
          total += val;
        }
      });
      // sum EoF builds by rank count
      EOF_CLASSES.forEach(cls => {
        const obj = eofBuilds[cls];
        const tree = eofTrees[cls];
        if (!obj || !tree) return;
        Object.entries(obj).forEach(([id, val]) => {
          if (!val || val <= 0) return;
          total += val;
        });
      });
      // Determine if the play buttons should be disabled.  Only disable
      // playback when there is no recorded sequence or when more than
      // 100 ranks have been allocated.  Removal of points no longer
      // prevents playback.
      let reason = '';
      if (!pointSequence || pointSequence.length === 0) {
        reason = 'Playback disabled: no points recorded';
      } else if (total > 100) {
        reason = 'Playback disabled: more than 100 points spent';
      }
      const disabled = reason !== '';
      playBtn.disabled = disabled;
      eofPlayBtn.disabled = disabled;
      playBtn.title = reason;
      eofPlayBtn.title = reason;
    }

    // The previous implementation of playBuildImproved has been removed.  All
    // playback functionality is handled by playBuild(), which decodes the
    // sequence from the URL and replays it across both KOS and EoF trees.

    function recalcPoints() {
      pointsSpent = treeData.reduce((sum, n) => sum + n.value * n.cost, 0);
      pointIndicator.textContent = `${pointsSpent}/${totalPoints}`;
      // Playback disabled; no need to update play button state.
    }

    // Override the playBuild function with an improved implementation.  This version
    // decodes the sequence from the URL on every invocation, ensuring playback works
    // when loading a saved URL.  It resets all builds, then replays the recorded
    // allocations at 0.5 seconds per point and adds an extra 0.5 second pause
    // whenever switching between KOS and EoF trees.  Finally it restores the
    // previously selected page and updates the URL and play button states.
    async function playBuild() {
      // Always attempt to decode the sequence from the current URL.  If
      // no sequence is present or decoding fails, fall back to the
      // in‑memory pointSequence.  This allows playback to work when
      // loading saved URLs or after page reloads.
      const params = new URLSearchParams(window.location.search);
      let seq;
      if (params.has('seq')) {
        try {
          seq = decodeSeq(params.get('seq'));
        } catch (err) {
          console.error('Failed to decode seq for playback:', err);
          seq = pointSequence;
        }
      } else {
        seq = pointSequence;
      }
      if (!seq || seq.length === 0) return;
      // Remember the currently selected classes to restore at the end
      const savedKosClass = kosSelect.value;
      const savedEofClass = eofSelect.value;
      // Clear all existing points across every KOS and EoF class
      KOS_CLASSES.forEach(cls => {
        builds[cls] = new Array(nodeCount).fill(0);
      });
      EOF_CLASSES.forEach(cls => {
        const obj = eofBuilds[cls];
        if (obj) Object.keys(obj).forEach(id => { obj[id] = 0; });
      });
      // Reset the removed flag since we are reconstructing the build
      removedFlag = false;
      // Refresh both trees before playback begins
      recalcPoints();
      if (typeof recalcEofPoints === 'function') recalcEofPoints();
      renderTree();
      if (typeof renderEofTree === 'function') renderEofTree();
      // Utility to wait for a given number of milliseconds
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      let lastTree = null;
      // Iterate through each entry in the recorded sequence
      for (const ent of seq) {
        // Determine if we need an additional half‑second delay when switching trees
        let delay = 500;
        if (lastTree && ent.tree !== lastTree) delay += 500;
        if (ent.tree === 'KOS') {
          // Switch the UI to the specified KOS class
          selectedClass = ent.class;
          kosSelect.value = ent.class;
          eofSelect.value = '';
          mode = 'KOS';
          treeContainer.style.display = 'flex';
          eofTreeContainer.style.display = 'none';
          loadBuild();
          // Allocate one rank for the specified node index
          const idx = ent.index;
          if (treeData[idx]) {
            treeData[idx].value++;
            builds[selectedClass][idx] = treeData[idx].value;
            recalcPoints();
            renderTree();
          }
        } else if (ent.tree === 'EOF') {
          // Switch the UI to the specified EoF class
          selectedEofClass = ent.class;
          eofSelect.value = ent.class;
          kosSelect.value = '';
          mode = 'EOF';
          treeContainer.style.display = 'none';
          eofTreeContainer.style.display = 'flex';
          loadEofBuild();
          // Ensure the build object exists
          if (!eofBuilds[selectedEofClass]) eofBuilds[selectedEofClass] = {};
          const tree = eofTrees[selectedEofClass];
          if (tree) {
            // Determine node index for the recorded id; if the entry uses index
            if (typeof ent.id !== 'undefined') {
              // ent.id stores the node id for EoF
              const id = ent.id;
              const node = tree.nodes.find(n => n.id === id);
              const cur = eofBuilds[selectedEofClass][id] || 0;
              if (node && cur < node.max) {
                eofBuilds[selectedEofClass][id] = cur + 1;
              }
            } else if (typeof ent.index !== 'undefined') {
              // Fallback: convert index to id via tree.nodes
              const node = tree.nodes[ent.index];
              if (node) {
                const cur = eofBuilds[selectedEofClass][node.id] || 0;
                if (cur < node.max) {
                  eofBuilds[selectedEofClass][node.id] = cur + 1;
                }
              }
            }
            if (typeof recalcEofPoints === 'function') recalcEofPoints();
            if (typeof renderEofTree === 'function') renderEofTree();
          }
        }
        lastTree = ent.tree;
        // Wait before allocating next rank
        await sleep(delay);
      }
      // Restore the previously selected class after playback is complete
      if (savedKosClass) {
        mode = 'KOS';
        selectedClass = savedKosClass;
        kosSelect.value = savedKosClass;
        eofSelect.value = '';
        treeContainer.style.display = 'flex';
        eofTreeContainer.style.display = 'none';
        loadBuild();
      } else if (savedEofClass) {
        mode = 'EOF';
        selectedEofClass = savedEofClass;
        eofSelect.value = savedEofClass;
        kosSelect.value = '';
        treeContainer.style.display = 'none';
        eofTreeContainer.style.display = 'flex';
        loadEofBuild();
      } else {
        // If nothing was selected, hide both containers
        treeContainer.style.display = 'none';
        eofTreeContainer.style.display = 'none';
      }
      // Update the URL with the reconstructed build
      updateURL();
    }

    function renderTree() {
      // Set explicit column widths and row heights to widen spacing and align labels
      const cols = 5;
      treeEl.style.gridTemplateColumns = `repeat(${cols}, ${nodeSize}px)`;
      treeEl.style.gridAutoRows = `${nodeSize}px`;
      treeEl.style.maxWidth = `calc(${cols} * ${nodeSize}px + ${(cols - 1) * 8}px)`;

      treeEl.innerHTML = '';
      for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 5; col++) {
          const idx = nodeTemplate.findIndex(n => n.x === col && n.y === row);
          if (idx < 0) { treeEl.appendChild(document.createElement('div')); continue; }
          const data = treeData[idx];
          const node = document.createElement('div');
          node.className = 'node';
          // apply colour class based on column for KOS nodes, except for the top
          // shared node (row 0, column 2) which belongs to every line
          if (!(data.y === 0 && data.x === 2)) {
            node.classList.add(`line${data.x}`);
          }

          // apply the new endline rule here:
          const canClick =
            data.value < data.max &&
            pointsSpent + data.cost <= totalPoints &&
            (data.y === 0 ||
             (data.y === 5
               ? canEndline(data)      // enforce ≥16 pts in that column
               : canProgress(data)));  // existing 1→4 tier checks

          node.classList.add(canClick ? 'clickable' : 'unclickable');
          if (data.value > 0) node.classList.add('selected');
          node.textContent = `${data.value}/${data.max}`;
          // record the index and grid coordinates on the element for use when
          // drawing vertical connectors.  These data attributes allow
          // drawKosLines() to identify parent/child nodes by row and column.
          node.dataset.index = idx;
          node.dataset.row   = data.y;
          node.dataset.col   = data.x;

          // tooltip
          const tip = document.createElement('div');
          tip.className = 'tooltip';
          const classTips = classTooltips[selectedClass];
          if (classTips && classTips[idx]) {
            const t = classTips[idx];
            tip.innerHTML = `<strong>${t.name}</strong><br>${t.description}<br><em>Cost: ${data.cost}, Max: ${data.max}</em>`;
          } else {
            tip.textContent = `Cost: ${data.cost}, Max: ${data.max}`;
          }
          node.appendChild(tip);

          node.onclick = () => {
            if (canClick) {
              lastEditedClass = selectedClass;
              data.value++;
              // record allocation in the global sequence
              if (typeof pointSequence !== 'undefined') {
                pointSequence.push({ tree: 'KOS', class: selectedClass, index: idx });
              }
              saveBuild();
              recalcPoints();
              renderTree();
              // playback removed; no play button to update
            }
          };
          node.oncontextmenu = e => {
            e.preventDefault();
            if (data.value > 0) {
              lastEditedClass = selectedClass;
              data.value--;
              // remove the last matching KOS entry from the sequence
              if (typeof pointSequence !== 'undefined' && Array.isArray(pointSequence)) {
                for (let i = pointSequence.length - 1; i >= 0; i--) {
                  const ent = pointSequence[i];
                  if (ent.tree === 'KOS' && ent.class === selectedClass && ent.index === idx) {
                    pointSequence.splice(i, 1);
                    break;
                  }
                }
              }
              saveBuild();
              recalcPoints();
              renderTree();
              // playback removed; no play button to update
            }
          };
          treeEl.appendChild(node);
        }
      }

      // After drawing nodes, draw vertical connectors behind them.  Use
      // requestAnimationFrame to ensure the DOM has laid out the grid so
      // positions are accurate.
      requestAnimationFrame(drawKosLines);

      // After drawing nodes and connectors, update the column labels for the KOS tree
      const labelsEl = document.getElementById('lineLabelsKos');
      if (labelsEl) {
        // ensure the number of columns in the label grid matches the tree grid
        labelsEl.style.gridTemplateColumns = `repeat(5, ${nodeSize}px)`;
        labelsEl.innerHTML = '';
        // Determine names for each branch based on the final ability in that column.
        const names = [];
        for (let i = 0; i < 5; i++) {
          let name = null;
          // locate the deepest node in this column (highest y) as the endline
          // In KOS trees, endlines reside at row 5 for each column.
          const idx = nodeTemplate.findIndex(n => n.x === i && n.y === 5);
          const tips = classTooltips[selectedClass];
          if (idx >= 0 && tips && tips[idx]) {
            name = tips[idx].name;
            // strip any prefix like "Enhance: " or "Enhance - "
            name = name.replace(/^Enhance[:\s-]+/i, '').trim();
          }
          names.push(name || `Line ${i + 1}`);
        }
        for (let i = 0; i < 5; i++) {
          const lbl = document.createElement('div');
          lbl.className = 'label';
          lbl.textContent = names[i];
          // colour label text to match the column colour
          lbl.style.color = lineColors[i % lineColors.length];
          labelsEl.appendChild(lbl);
        }
      }
    }

    // old progression logic (top → tier-1 → tier-2/3/4)
    function canProgress(node) {
      if (node.y === 1) return treeData[0].value >= 1;
      const prevIdx = nodeTemplate.findIndex(n => n.x === node.x && n.y === node.y - 1);
      return treeData[prevIdx].value >= 4;
    }

    // new endline logic: require ≥4 points in *each* of the 4 preceding nodes
    function canEndline(node) {
      // for tiers y=1…4 in this column, confirm each has value ≥4
      return [1,2,3,4].every(y => {
        const idx = nodeTemplate.findIndex(n => n.x === node.x && n.y === y);
        return treeData[idx].value >= 4;
      });
    }

    /* --------------------------------------------------------------------------
     * EoF functionality
     *
     * The following functions mirror the existing KOS logic but operate on a
     * completely different data model.  Nodes are addressed by id strings rather
     * than numeric indices, prerequisites are evaluated using an OR semantics
     * (any prerequisite satisfied will unlock the node) and endlines require
     * spending a minimum number of points in the corresponding line (branch).
     */

    // Recalculate total points spent in the current EoF tree and update the UI
    function recalcEofPoints() {
      eofPointsSpent = eofTreeData.reduce((sum, n) => sum + n.value * n.cost, 0);
      // Always display progress relative to the EoF cap rather than the raw maximum
      eofPointIndicator.textContent = `${eofPointsSpent}/${eofMaxPoints}`;
      // Playback removed; no play button to update
    }

    // Determine whether a node can be progressed.  A node is clickable if it
    // hasn’t reached its maximum rank, all prerequisites (if any) are satisfied
    // and, for endlines, enough points have been invested in the line.
    function canClickEof(node) {
      if (!node) return false;
      if (node.value >= node.max) return false;
      // enforce overall point cap on EoF trees
      if (eofPointsSpent + node.cost > eofMaxPoints) return false;
      // check prerequisites (OR semantics)
      if (node.prereqs && node.prereqs.length > 0) {
        const ok = node.prereqs.some(pr => {
          const val = eofBuilds[selectedEofClass][pr.id] ?? 0;
          return val >= pr.rank;
        });
        if (!ok) return false;
      }
      // endline gating: require points in line ≥ gating threshold
      const treeObj = eofTrees[selectedEofClass];
      const lineInfo = treeObj.lines[node.line];
      // custom gating for certain mid-line abilities that require a minimum number of points in their line
      // Compute points spent in this line (excluding the node itself) and gate specific abilities accordingly.
      let spentLine = 0;
      treeObj.nodes.forEach(n => {
        if (n.line === node.line && n.id !== node.id) {
          spentLine += (eofBuilds[selectedEofClass][n.id] ?? 0) * n.cost;
        }
      });
      // Inferno Surge (Heat) and Frigid Gift (Cold) require at least 15 points spent in their line before they can be progressed
      if ((node.id === 'infernoSurge' || node.id === 'frigidGift') && spentLine < 15) return false;
      if (node.max === 1 && node.row === treeObj.gridRows - 1) {
        // compute points spent in this line (exclude the endline itself)
        let spent = 0;
        treeObj.nodes.forEach(n => {
          if (n.line === node.line && n.id !== node.id) {
            spent += (eofBuilds[selectedEofClass][n.id] ?? 0) * n.cost;
          }
        });
        if (spent < lineInfo.gating) return false;
      }
      return true;
    }

    // Render the currently selected EoF tree into the DOM.  The grid
    // dimensions are derived from the tree definition.  This function also
    // attaches click and context menu handlers for rank adjustments.
    function renderEofTree() {
      const treeObj = eofTrees[selectedEofClass];
      const rows = treeObj.gridRows;
      const cols = treeObj.gridCols;
      // Dynamically size the EoF grid relative to the viewport so it scales nicely on 1080p and 4K displays.
      // Use 80% of the available viewport dimensions to compute a base cell size, capped by nodeSize.
      // Compute tentative cell dimensions based on 80% of the available viewport
      // space.  Divide the 80% width by the number of columns and the 80% height
      // by the number of rows.  These values determine how much space could be
      // allocated per cell if we allowed the tree to span the full 80% in both
      // axes.
      const dynamicWidth  = Math.floor((window.innerWidth  * 0.8) / cols);
      const dynamicHeight = Math.floor((window.innerHeight * 0.8) / rows);
      // We want the EoF tree to remain compact on very large resolutions, so cap
      // the cell dimensions at a reasonable maximum.  At the same time, ensure
      // they never shrink below the nodeSize to avoid clipping the node itself.
      // Cap the size of each grid cell.  Limiting this to 90px keeps the
      // Echoes of Faydwer tree from stretching too far across very large
      // displays while still allowing a modest amount of spacing between
      // nodes.  This helps the EoF tree feel less rigid and more compact.
      const maxCellSize   = 90;
      const cellWidth  = Math.min(maxCellSize, Math.max(nodeSize, dynamicWidth));
      const cellHeight = Math.min(maxCellSize, Math.max(nodeSize, dynamicHeight));
      eofTreeEl.style.gridTemplateColumns = `repeat(${cols}, ${cellWidth}px)`;
      eofTreeEl.style.gridAutoRows = `${cellHeight}px`;
      // A smaller intercolumn gap helps tighten up the layout.  Use 6px here.
      eofTreeEl.style.maxWidth = `calc(${cols} * ${cellWidth}px + ${(cols - 1) * 4}px)`;
      eofTreeEl.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // find node matching row/col
          const idx = eofTreeData.findIndex(n => n.row === r && n.col === c);
          if (idx === -1) {
            eofTreeEl.appendChild(document.createElement('div'));
            continue;
          }
          const data = eofTreeData[idx];
          const nodeEl = document.createElement('div');
          nodeEl.className = 'node';
          // apply a colour based on the branch index rather than the raw
          // column number.  Each branch begins at a multiple of three
          // columns (0,3,6,9,…).  Dividing the column by three yields
          // the 0‑based branch index.  The modulo guards against
          // classes with more than five branches.
          // Determine branch index by looking up the node’s line within
          // treeObj.lines.  The order of keys returned from Object.keys
          // matches the branch order used during initialisation.
          const branchNames = Object.keys(treeObj.lines);
          let branchIndex = branchNames.indexOf(data.line);
          // For the Monk EoF tree, swap the colours for the 'Combat' and 'Body' lines.
          // By default the first entry in lineColors applies to the first branch defined
          // in eofTrees.Monk.lines.  If the class is Monk, invert the indices for these
          // two specific lines so that Combat takes the second colour and Body the first.
          if (selectedEofClass === 'Monk') {
            if (data.line === 'Combat') {
              branchIndex = branchNames.indexOf('Body');
            } else if (data.line === 'Body') {
              branchIndex = branchNames.indexOf('Combat');
            }
          } else if (selectedEofClass === 'Wizard') {
            // For the Wizard EoF tree, swap the colours for the 'Cold' and
            // 'Power' branches so Cold is blue and Power is yellow.  Do this
            // by swapping their branch indices.
            if (data.line === 'Cold') {
              branchIndex = branchNames.indexOf('Power');
            } else if (data.line === 'Power') {
              branchIndex = branchNames.indexOf('Cold');
            }
          }
          nodeEl.classList.add(`line${branchIndex % lineColors.length}`);
          // mark clickable vs unclickable
          const canClick = canClickEof(data);
          nodeEl.classList.add(canClick ? 'clickable' : 'unclickable');
          if (data.value > 0) nodeEl.classList.add('selected');
          nodeEl.textContent = `${data.value}/${data.max}`;
          // tooltip content
          const tip = document.createElement('div');
          tip.className = 'tooltip';
          // Compose a prerequisite string if this ability has dependencies.  Each
          // prereq references the id of another node and the required rank.  We
          // look up the referenced node in the current class tree to get its
          // display name.  Multiple prerequisites are joined with “or” per the
          // design document.
          let prereqHTML = '';
          if (data.prereqs && data.prereqs.length > 0) {
            const prereqNames = data.prereqs.map(pr => {
              const ref = treeObj.nodes.find(n => n.id === pr.id);
              const refName = ref ? ref.name : pr.id;
              return `${refName} (Rank ${pr.rank})`;
            });
            prereqHTML = `<em>Requires ${prereqNames.join(' or ')}</em><br>`;
          }
          // If this node is an endline (max = 1) and the branch defines a
          // gating requirement, append the gating text.  Endline gating is
          // independent of explicit prerequisites.
          let gatingHTML = '';
          if (data.max === 1) {
            const lineInfo = treeObj.lines[data.line];
            if (lineInfo && lineInfo.gating) {
              gatingHTML = `<em>Requires ${lineInfo.gating} points in ${data.line}</em><br>`;
            }
          }
          tip.innerHTML = `<strong>${data.name}</strong><br>${data.description}<br>` +
            prereqHTML + gatingHTML + `<em>Cost: ${data.cost}, Max: ${data.max}</em>`;
          nodeEl.appendChild(tip);
          nodeEl.dataset.index = idx;
          // click handlers
          nodeEl.onclick = () => {
            if (canClickEof(data)) {
              data.value++;
              eofBuilds[selectedEofClass][data.id] = data.value;
              // record allocation in the global sequence
              if (typeof pointSequence !== 'undefined') {
                pointSequence.push({ tree: 'EOF', class: selectedEofClass, id: data.id });
              }
              updateURL();
              recalcEofPoints();
              renderEofTree();
              // playback removed; no play button to update
            }
          };
          nodeEl.oncontextmenu = (e) => {
            e.preventDefault();
            if (data.value > 0) {
              data.value--;
              eofBuilds[selectedEofClass][data.id] = data.value;
              // do not disable playback on removal
              // remove the last matching EoF entry from the sequence
              if (typeof pointSequence !== 'undefined' && Array.isArray(pointSequence)) {
                for (let i = pointSequence.length - 1; i >= 0; i--) {
                  const ent = pointSequence[i];
                  if (ent.tree === 'EOF' && ent.class === selectedEofClass && ent.id === data.id) {
                    pointSequence.splice(i, 1);
                    break;
                  }
                }
              }
              updateURL();
              recalcEofPoints();
              renderEofTree();
              // playback removed; no play button to update
            }
          };
          eofTreeEl.appendChild(nodeEl);
        }
      }
      // defer drawing lines to allow DOM to layout
      requestAnimationFrame(drawEofLines);

      // update the EoF column labels
      const lblEl = document.getElementById('lineLabelsEof');
      if (lblEl) {
        // set columns to match number of columns using the same dynamic logic as
        // the EoF grid itself.  Compute a dynamic width based on 80% of the
        // viewport and ensure the label width is never smaller than the node
        // size.  This keeps the line labels roughly aligned with the grid
        // columns at various resolutions.
        const dynamicLblWidth = Math.floor((window.innerWidth * 0.8) / cols);
        const maxCellSizeLbl   = 90;
        const lblSize = Math.min(maxCellSizeLbl, Math.max(nodeSize, dynamicLblWidth));
        lblEl.style.gridTemplateColumns = `repeat(${cols}, ${lblSize}px)`;
        lblEl.innerHTML = '';
        // order lines by the minimum column of nodes in that line
        const orderedLines = Object.keys(treeObj.lines).map((ln, i) => {
          const nodesInLine = eofTreeData.filter(n => n.line === ln);
          const minCol = nodesInLine.length ? Math.min(...nodesInLine.map(n => n.col)) : treeObj.lines[ln].col;
          return { name: ln, minCol, index: i };
        }).sort((a, b) => a.minCol - b.minCol);
        orderedLines.forEach((obj, idx) => {
          const d = document.createElement('div');
          d.className = 'label';
          d.textContent = obj.name;
          // Determine the base colour index for this branch by looking up its
          // position within the tree's line order.  This ensures labels
          // share the same colour as their corresponding nodes.  Adjust
          // certain classes (Monk, Wizard) by swapping indices to match
          // their custom colour assignments used during node rendering.
          const branchNames = Object.keys(treeObj.lines);
          let colorIndex = branchNames.indexOf(obj.name);
          if (selectedEofClass === 'Monk') {
            // Swap Combat and Body colours: Combat uses Body's index and
            // vice versa.  This mirrors the logic used when assigning
            // colours to the nodes themselves.
            if (obj.name === 'Combat') {
              colorIndex = branchNames.indexOf('Body');
            } else if (obj.name === 'Body') {
              colorIndex = branchNames.indexOf('Combat');
            }
          } else if (selectedEofClass === 'Wizard') {
            // For the Wizard EoF tree, assign blue to the Cold branch (index 1)
            // and yellow to the Power branch (index 3).  The other branches
            // follow the natural ordering.
            if (obj.name === 'Cold') {
              colorIndex = 1;
            } else if (obj.name === 'Power') {
              colorIndex = 3;
            }
          }
          d.style.color = lineColors[colorIndex % lineColors.length];
          // gather nodes for this line
          const nodesInLine = eofTreeData.filter(n => n.line === obj.name);
          let targetCol = obj.minCol;
          if (nodesInLine.length > 0) {
            // find the node(s) in this branch that represent the endline (max=1)
            const endNodes = nodesInLine.filter(n => n.max === 1);
            if (endNodes.length > 0) {
              // pick the endline with the greatest row (lowest on the grid)
              let deepest = endNodes[0];
              endNodes.forEach(n => {
                if (n.row > deepest.row) deepest = n;
              });
              targetCol = deepest.col;
            } else {
              // fallback: use the centre of min and max columns
              const min = Math.min(...nodesInLine.map(n => n.col));
              const max = Math.max(...nodesInLine.map(n => n.col));
              targetCol = Math.round((min + max) / 2);
            }
          }
          d.style.gridColumnStart = (targetCol + 1).toString();
          d.style.gridColumnEnd = `span 1`;
          lblEl.appendChild(d);
        });
      }
    }

    // Draw connecting lines between nodes.  Vertical connectors are drawn
    // between consecutive nodes in the same line.  Prerequisite lines are
    // drawn for cross-line relationships.  Uses an SVG overlay for crisp
    // rendering.
    function drawEofLines() {
      // clear previous lines
      eofLinks.innerHTML = '';
      const wrapperRect = eofTreeWrapper.getBoundingClientRect();
      // compute positions of each node
      const positions = {};
      eofTreeEl.querySelectorAll('.node').forEach(el => {
        const idx = parseInt(el.dataset.index, 10);
        const node = eofTreeData[idx];
        const rect = el.getBoundingClientRect();
        const x = rect.left - wrapperRect.left + rect.width / 2;
        const y = rect.top - wrapperRect.top + rect.height / 2;
        positions[node.id] = { x, y };
      });
      const treeObj = eofTrees[selectedEofClass];
      // vertical connectors within each line
      // For Echoes of Faydwer trees, only explicit prerequisite lines are drawn.  The original game artwork shows
      // solid links between abilities to indicate a progression path, but the exact layout varies by class and
      // sometimes leads to confusing horizontal connectors when multiple nodes share a row.  To avoid drawing
      // unintended horizontal or diagonal links, we omit the automatic vertical connectors here.  All required
      // relationships are represented via the dashed prerequisite lines below.
      Object.keys(treeObj.lines).forEach(() => {
        // intentionally left blank: skip drawing vertical connectors for EoF
      });
      // prerequisite connectors (cross-line only)
      eofTreeData.forEach(node => {
        if (!node.prereqs) return;
        node.prereqs.forEach(pr => {
          const from = positions[pr.id];
          const to = positions[node.id];
          if (!from || !to) return;
          // Draw a straight line from the prerequisite node to the current node.
          const lineElem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          // Shorten the line so it begins and ends at the edge of each
          // circular node rather than passing through the centre.  Compute
          // direction and offset by the node radius to avoid drawing over
          // the icons.
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const r = nodeSize / 2;
          const offsetX = (dx / dist) * r;
          const offsetY = (dy / dist) * r;
          const x1 = from.x + offsetX;
          const y1 = from.y + offsetY;
          const x2 = to.x - offsetX;
          const y2 = to.y - offsetY;
          lineElem.setAttribute('x1', x1);
          lineElem.setAttribute('y1', y1);
          lineElem.setAttribute('x2', x2);
          lineElem.setAttribute('y2', y2);
          lineElem.setAttribute('stroke', '#ffc857');
          lineElem.setAttribute('stroke-width', '2');
          lineElem.setAttribute('stroke-dasharray', '4 2');
          lineElem.setAttribute('stroke-linecap', 'round');
          eofLinks.appendChild(lineElem);
        });
      });
    }

    // Draw vertical connectors for the KOS tree.  Uses an SVG overlay to
    // connect each node to the one directly below it in the same column.
    function drawKosLines() {
      if (!kosLinks) return;
      kosLinks.innerHTML = '';
      // Determine the position of the container to compute relative coordinates
      const containerRect = treeContainer.getBoundingClientRect();
      const positions = {};
      // Gather positions for all KOS nodes currently rendered
      document.querySelectorAll('#tree .node').forEach(el => {
        const idx  = parseInt(el.dataset.index, 10);
        const row  = parseInt(el.dataset.row, 10);
        const col  = parseInt(el.dataset.col, 10);
        const rect = el.getBoundingClientRect();
        const x = rect.left - containerRect.left + rect.width / 2;
        const y = rect.top - containerRect.top + rect.height / 2;
        positions[idx] = { x, y, row, col };
      });
      // Draw a connector from each node to the one directly beneath it (if any)
      Object.keys(positions).forEach(key => {
        const pos = positions[key];
        // find a node in the next row of the same column
        const next = Object.values(positions).find(p => p.col === pos.col && p.row === pos.row + 1);
        if (next) {
          const lineElem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          // Shorten the line so it begins and ends at the edge of the nodes
          const dx = next.x - pos.x;
          const dy = next.y - pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const r = nodeSize / 2;
          const offsetX = (dx / dist) * r;
          const offsetY = (dy / dist) * r;
          const x1 = pos.x + offsetX;
          const y1 = pos.y + offsetY;
          const x2 = next.x - offsetX;
          const y2 = next.y - offsetY;
          lineElem.setAttribute('x1', x1);
          lineElem.setAttribute('y1', y1);
          lineElem.setAttribute('x2', x2);
          lineElem.setAttribute('y2', y2);
          // Colour the line to match the column’s colour
          const colour = lineColors[pos.col % lineColors.length];
          lineElem.setAttribute('stroke', colour);
          lineElem.setAttribute('stroke-width', '2');
          kosLinks.appendChild(lineElem);
        }
      });
    }

    // Load the current EoF build from storage and render it.  Called when the
    // EoF class selection changes.
    function loadEofBuild() {
      const treeObj = eofTrees[selectedEofClass];
      eofTreeData = treeObj.nodes.map(n => Object.assign({}, n, { value: eofBuilds[selectedEofClass][n.id] }));
      recalcEofPoints();
      renderEofTree();
    }

    init();
  </script>
</body>
